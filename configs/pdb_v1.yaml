dataset_version: pdb_v1
source:
  archive: wwPDB PDB Core Archive
  metadata_service: https://search.rcsb.org/rcsbsearch/v2/query
  coordinate_service: https://files.rcsb.org/download/{pdb_id}.cif.gz
  content_type: experimental
  protein_entities_min: 1
  coordinate_format: PDBx/mmCIF.gz
filter:
  methods: [xray, em]
  max_xray_resolution_angstrom: 3.0
  max_em_resolution_angstrom: 4.0
  min_observed_chain_length: 30
  max_unknown_aa_fraction: 0.20
  equal_aa_3di_length: true
clustering:
  min_sequence_identity: 0.30
  bidirectional_coverage: 0.80
  coverage_mode: 0
  alignment_mode: 3
  cluster_mode: 0
  sensitivity: 7.5
  max_seqs: 300
split:
  seed: 42
  validation_groups: 1000
  test_groups: 1000
  evaluation_length: [30, 510]
  representative: best_resolution_then_lexicographic_id
audit:
  sequence_identity: 0.30
  bidirectional_coverage: 0.80
  train_target_shard_size: 50000
  structural_neighbors_are_report_only: true
