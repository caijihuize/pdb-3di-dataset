[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb-3di-dataset"
version = "0.1.0"
description = "Experimental PDB protein chain to AA and Foldseek 3Di dataset pipeline"
requires-python = ">=3.10"
dependencies = ["biopython>=1.80", "pyarrow>=12", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]
